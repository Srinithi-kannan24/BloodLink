<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloodLink | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

    <section class="auth-page">

        <div class="container">

            <div class="row auth-container shadow-lg">

                <!-- ==========================
                        LEFT SIDE
                =========================== -->

                <div class="col-lg-5 auth-left">

                    <div class="auth-card">

                        <div class="auth-logo">

                            <i class="bi bi-heart-pulse-fill"></i>

                            <span>BloodLink</span>

                        </div>

                        <h2 class="auth-title">

                            Welcome Back

                        </h2>

                        <p class="auth-subtitle">

                            Login to access the BloodLink Management System.

                        </p>

                        <form action="/login" method="POST" class="auth-form">

                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input

                                    type="email"

                                    name="email"

                                    class="form-control auth-input"

                                    placeholder="Enter your email"

                                    required>

                            </div>

                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <div class="auth-password-box">

                                    <input

                                        type="password"

                                        id="password"

                                        name="password"

                                        class="form-control auth-input"

                                        placeholder="Enter password"

                                        required>

                                    <i class="bi bi-eye" id="togglePassword"></i>

                                </div>

                            </div>

                            <!-- Role -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Login As

                                </label>

                                <select

                                    name="role"

                                    class="form-select auth-select"

                                    required>

                                    <option value="">Choose Role</option>

                                    <option value="Donor">Donor</option>

                                    <option value="Hospital">Hospital</option>

                                    <option value="Blood Bank">Blood Bank</option>

                                    <option value="Admin">Administrator</option>

                                </select>

                            </div>

                            <!-- Remember -->

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input

                                        class="form-check-input"

                                        type="checkbox"

                                        id="remember">

                                    <label

                                        class="form-check-label"

                                        for="remember">

                                        Remember Me

                                    </label>

                                </div>

                                <a href="#" class="forgot-link">

                                    Forgot Password?

                                </a>

                            </div>

                            <button

                                type="submit"

                                class="auth-submit-btn">

                                Login

                            </button>

                        </form>

                        <div class="auth-register">

                            Don't have an account?

                            <a href="/register">

                                Register

                            </a>

                        </div>

                    </div>

                </div>

                <!-- ==========================
                        RIGHT SIDE
                =========================== -->

                <div class="col-lg-7 auth-right">

                    <img

                        src="https://images.unsplash.com/photo-1615461066841-6116e61058f4?w=1200"

                        class="auth-image"

                        alt="Blood Donation">

                    <div class="auth-overlay">

                        <h2>

                            Donate Blood. Save Lives.

                        </h2>

                        <p>

                            Connecting donors, hospitals and blood banks through one secure cloud platform.

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login JS -->
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
